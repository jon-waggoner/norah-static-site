<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1rem;
    }

    .back-link {
      position: fixed;
      top: 15px;
      right: 20px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 10;
    }
    .back-link:hover { color: white; }

    h1 {
      color: #ffd700;
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .game-container {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 1.2rem;
      backdrop-filter: blur(10px);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .info-panel {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      color: #ff4444;
      font-family: 'Courier New', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      min-width: 70px;
    }

    .info-panel .label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      font-family: 'Segoe UI', sans-serif;
      font-weight: normal;
    }

    #reset-btn {
      font-size: 1.6rem;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reset-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.1);
    }

    .difficulty {
      display: flex;
      gap: 0.4rem;
    }

    .difficulty button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .difficulty button:hover {
      background: rgba(255,255,255,0.15);
      color: white;
    }
    .difficulty button.active {
      background: rgba(255, 215, 0, 0.3);
      border-color: rgba(255, 215, 0, 0.6);
      color: #ffd700;
    }

    #grid {
      display: inline-grid;
      gap: 2px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 4px;
      user-select: none;
      -webkit-user-select: none;
    }

    .cell {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .cell.hidden {
      background: linear-gradient(145deg, #6a7baf, #4a5a8f);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .cell.hidden:hover {
      background: linear-gradient(145deg, #7a8bbf, #5a6a9f);
    }
    .cell.hidden:active {
      background: linear-gradient(145deg, #3a4a7f, #4a5a8f);
    }

    .cell.revealed {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: default;
    }

    .cell.flagged {
      background: linear-gradient(145deg, #6a7baf, #4a5a8f);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .cell.mine-hit {
      background: rgba(255, 50, 50, 0.5) !important;
    }

    .cell.mine-revealed {
      background: rgba(255, 100, 100, 0.15);
    }

    .cell .flag { font-size: 1rem; }
    .cell .mine { font-size: 1.1rem; }

    .n1 { color: #5b9aff; }
    .n2 { color: #4ecf4e; }
    .n3 { color: #ff5555; }
    .n4 { color: #3355cc; }
    .n5 { color: #993333; }
    .n6 { color: #33aaaa; }
    .n7 { color: #cccccc; }
    .n8 { color: #888888; }

    .message {
      text-align: center;
      margin-top: 0.8rem;
      font-size: 1.1rem;
      min-height: 1.6rem;
      color: rgba(255,255,255,0.7);
    }
    .message.win { color: #ffd700; }
    .message.lose { color: #ff5555; }

    .mobile-hint {
      display: none;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }

    @media (pointer: coarse) {
      .mobile-hint { display: block; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .cell { width: 28px; height: 28px; font-size: 0.8rem; }
      .game-container { padding: 0.8rem; }
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">Back to Games</a>
  <h1>Minesweeper</h1>
  <div class="game-container">
    <div class="controls">
      <div class="info-panel">
        <span class="label">Mines</span>
        <span id="mine-count">15</span>
      </div>
      <button id="reset-btn">😊</button>
      <div class="info-panel">
        <span class="label">Time</span>
        <span id="timer">000</span>
      </div>
    </div>
    <div class="difficulty">
      <button data-difficulty="easy">Easy</button>
      <button data-difficulty="medium" class="active">Medium</button>
      <button data-difficulty="hard">Hard</button>
    </div>
    <div id="grid"></div>
    <div class="message" id="message"></div>
    <div class="mobile-hint">Tap to reveal - Long press to flag</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
