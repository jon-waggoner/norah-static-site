<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norah's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #2a1a3e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    h1 {
      color: #ffd700;
      font-size: 3rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      z-index: 1;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
      margin-bottom: 3rem;
      z-index: 1;
    }

    .games {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
      padding: 0 1rem;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 280px;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .game-icon {
      margin-bottom: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
    }

    .game-icon img {
      display: block;
      max-width: 100%;
    }

    .icon-dog {
      width: 80px;
      height: 80px;
      animation: spin 4s linear infinite;
    }

    .icon-plane {
      width: 120px;
      height: auto;
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .game-title {
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .game-desc {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .card-stars .game-card { border-color: rgba(255, 215, 0, 0.3); }
    .card-stars .game-card:hover { border-color: rgba(255, 215, 0, 0.6); }

    .card-flight .game-card { border-color: rgba(100, 200, 255, 0.3); }
    .card-flight .game-card:hover { border-color: rgba(100, 200, 255, 0.6); }

    .card-minesweeper .game-card { border-color: rgba(100, 255, 150, 0.3); }
    .card-minesweeper .game-card:hover { border-color: rgba(100, 255, 150, 0.6); }

    .icon-mine {
      font-size: 56px;
      line-height: 1;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <h1>Norah's Games</h1>
  <p class="subtitle">Pick a game to play!</p>

  <div class="games">
    <div class="card-stars">
      <a href="/star-catcher/" class="game-card">
        <span class="game-icon"><img src="star-catcher/dog.png" alt="Puppy" class="icon-dog"></span>
        <div class="game-title">Star Catcher</div>
        <div class="game-desc">Catch falling stars in your basket! Watch out for the bonus puppy!</div>
      </a>
    </div>
    <div class="card-flight">
      <a href="/flight/" class="game-card">
        <span class="game-icon"><img src="flight/plane.png" alt="Airplane" class="icon-plane"></span>
        <div class="game-title">Sky Pilot</div>
        <div class="game-desc">Fly your plane, dodge obstacles, and land safely!</div>
      </a>
    </div>
    <div class="card-minesweeper">
      <a href="/minesweeper/" class="game-card">
        <span class="game-icon"><span class="icon-mine">💣</span></span>
        <div class="game-title">Minesweeper</div>
        <div class="game-desc">Find all the safe squares without hitting a mine!</div>
      </a>
    </div>
  </div>

  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (Math.random() * 2 + 2) + 's';
      container.appendChild(star);
    }
  </script>
</body>
</html>
